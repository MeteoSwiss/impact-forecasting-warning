[project]
name = "impact-forecasting-warning"
version = "0.0.0"  # DO NOT SET. The version of the package is always set by the CI/CD pipeline.
description = "A system for forecasting and visualizing weather impact warnings for Switzerland using CLIMADA."
license = { text = "BSD-3-Clause" }
authors = [{ name = "Michele Cattaneo", email = "michele.cattaneo@meteoswiss.ch" }]
readme = "README.rst"
requires-python = ">=3.10,<3.13"
dependencies = [
    "earthkit-data>=0.20.0,<0.21.0",
    "climada",
    "meteodata-lab>=0.7.2,<0.8.0",
    "srtm-py>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0,<2.0.0",
    "pydata-sphinx-theme>=0.16.1,<0.17.0",
    "pylint>=3.3.5,<4.0.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "sphinx>=8.1.3,<9.0.0",
    "sphinx-autoapi>=3.6.0,<4.0.0",
    "yapf>=0.43.0,<0.44.0",
]

[tool.setuptools]
packages = ["impact_forecasting_warning"]

[tool.yapf]
based_on_style = "pep8"
column_limit = "120"

[tool.pylint.master]
disable = [
    'C0114', # missing-module-docstring
    'C0115', # missing-class-docstring
    'C0116', # missing-function-docstring
    'W0511', # fix me or to-do comments are already covered by SonarQube
]

[tool.pylint.basic]
argument-naming-style = 'any'
attr-naming-style = 'any'

[tool.pylint.format]
# Maximum number of lines in a module.
max-line-length = 120

[tool.pylint.design]
# Minimum number of public methods for a class (see R0903).
min-public-methods = 0

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true


[tool.coverage.run]
omit = ["test/**",  "doc/**"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
